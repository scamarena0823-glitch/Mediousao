name: Attach MEDIOUSAO ready flow

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  attach:
    if: ${{ contains(github.event.head_commit.message, 'Attach ready flow') && !contains(github.event.head_commit.message, '[skip ready flow]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Attach ready-flow.js to index.html
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          tag = '<script src="ready-flow.js"></script>'
          if tag not in s:
              s = s.replace('</body>', tag + '\n</body>')
              p.write_text(s, encoding='utf-8')
          else:
              print('ready-flow.js already attached')
          PY

      - name: Commit and push
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
          else
            git commit -m 'Attach ready flow to MEDIOUSAO [skip ready flow]'
            git push
          fi
