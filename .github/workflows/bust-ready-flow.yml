name: Bust ready flow cache

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  bust:
    if: "contains(github.event.head_commit.message, 'Fix Reservar ahora click flow')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update ready-flow version
        run: |
          sed -i 's/ready-flow.js?v=20260913-4/ready-flow.js?v=20260913-5/' index.html
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Bust ready flow click cache' || exit 0
          git push
