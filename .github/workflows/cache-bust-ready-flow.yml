name: Cache bust ready flow

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  cache-bust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update ready-flow cache version
        shell: bash
        run: |
          if grep -q 'ready-flow.js?v=20260913-1' index.html; then
            sed -i 's/ready-flow.js?v=20260913-1/ready-flow.js?v=20260913-4/' index.html
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add index.html
            git commit -m 'Cache-bust MEDIOUSAO ready flow'
            git push
          else
            echo 'Cache version already updated; no changes needed.'
          fi
