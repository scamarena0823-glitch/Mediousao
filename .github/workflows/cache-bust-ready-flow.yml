name: Cache bust ready flow

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  cache-bust:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update ready-flow cache version
        shell: bash
        run: |
          if grep -q 'ready-flow.js?v=' index.html; then
            sed -i -E 's/ready-flow\.js\?v=[^"'"'"']+/ready-flow.js?v=20260913-12/' index.html
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add index.html
            if ! git diff --cached --quiet; then
              git commit -m 'Cache-bust MEDIOUSAO ready flow v12'
              git push
            fi
          fi
