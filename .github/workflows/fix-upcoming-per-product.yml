name: Fix Próximamente per product
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index.html
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='<!-- MEDIOUSAO_UPCOMING_PER_PRODUCT -->'
          if marker in s:
              print('Patch already present')
              raise SystemExit
          script=r'''<!-- MEDIOUSAO_UPCOMING_PER_PRODUCT -->
          <script>
          window.toggleUpcoming = async function(id, value){
            const {error}=await client.from('products').update({is_upcoming:value}).eq('id',id);
            if(error){ alert('No se pudo actualizar: '+error.message); return; }
            await window.loadAdminProducts();
            if(typeof loadUpcomingAdmin==='function') await loadUpcomingAdmin();
            if(typeof loadUpcoming==='function') await loadUpcoming();
          };
          window.loadAdminProducts = async function(){
            const box=document.getElementById('adminProducts');
            if(!box) return;
            box.innerHTML='Cargando productos…';
            const {data,error}=await client.from('products').select('*').eq('city',SERVICE_CITY).order('created_at',{ascending:false});
            if(error){box.innerHTML='<div class="error">'+esc(error.message)+'</div>';return;}
            if(!data?.length){box.innerHTML='<div class="notice">No hay productos.</div>';return;}
            box.innerHTML=data.map(p=>{
              const upcoming=!!p.is_upcoming;
              const status=upcoming?'<span class="status-pill">⏳ Próximamente</span>':(p.active?'<span class="status-pill green">Disponible</span>':'<span class="status-pill red">Oculto</span>');
              return `<div class="admin-item"><div class="row"><div><b>${esc(p.name)}</b><div class="muted">${money(p.price)} · Stock: ${p.stock??0}</div></div>${status}</div><div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px"><button class="btn" onclick="toggleUpcoming('${p.id}',${!upcoming})">${upcoming?'Quitar Próximamente':'⏳ Marcar Próximamente'}</button><button class="btn" onclick="${p.active?'markProductUnavailable':'markProductAvailable'}('${p.id}')">${p.active?'Marcar no disponible':'Publicar'}</button></div></div>`;
            }).join('');
          };
          </script>
          '''
          s=s.replace('</body>', script+'\n</body>', 1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Fix Próximamente control per product"
          git push