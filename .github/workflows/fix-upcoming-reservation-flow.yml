name: Fix Próximamente reservation flow

on:
  push:
    paths:
      - '.github/workflows/fix-upcoming-reservation-flow.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update upcoming reservation UI
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('index.html')
          s = path.read_text(encoding='utf-8')

          # Upcoming cards: one button only, "Reservar ahora".
          old = '''const action=reserved
      ? `<div class="tag" style="font-weight:900;color:#111;margin-top:10px">🔒 RESERVADO</div>`
      : `<button class="btn primary full" onclick="reserveUpcoming('${p.id}','delivery')">🛵 Reservar</button><button class="btn full" style="margin-top:7px" onclick="reserveUpcoming('${p.id}','pickup')">🏪 Recoger</button>`;'''
          new = '''const action=reserved
      ? `<div class="tag" style="font-weight:900;color:#111;margin-top:10px">🔒 RESERVADO</div>`
      : `<button class="btn primary full" onclick="reserveUpcoming('${p.id}')">Reservar ahora</button>`;'''
          if old in s:
              s = s.replace(old, new, 1)

          # Replace the upcoming reservation function so it asks only for name and phone.
          pattern = r'function reserveUpcoming\(id,mode\)\{.*?\n\}\n\nasync function loadProducts\(\)'
          replacement = '''function reserveUpcoming(id){
  selectedProduct=upcomingProducts.find(p=>p.id===id);
  reserveMode="upcoming";
  if(!selectedProduct)return;
  document.getElementById("reserveProduct").innerHTML=`<b>${esc(selectedProduct.name)}</b> · ${money(selectedProduct.price)}<br><span class="muted">⏳ Próximamente · Te notificaremos cuando esté disponible.</span>`;
  document.getElementById("deliveryFields").style.display="none";
  document.getElementById("pickupFields").style.display="none";
  document.getElementById("reserveBtn").textContent="Reservar ahora";
  show("reserve");
}

async function loadProducts()'''
          s, n = re.subn(pattern, replacement, s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit('No se encontró la función reserveUpcoming para actualizar')

          # Reservation screen: keep name/phone visible, hide delivery/pickup until product is ready.
          marker = '<label>Nombre completo</label><input id="rName" placeholder="Tu nombre"><br><br>\n<label>Teléfono</label><input id="rPhone" placeholder="809-000-0000"><br><br>\n<div id="deliveryFields">'
          replacement_marker = '<label>Nombre completo</label><input id="rName" placeholder="Tu nombre"><br><br>\n<label>Teléfono</label><input id="rPhone" placeholder="809-000-0000"><br><br>\n<div id="deliveryFields" style="display:none">'
          if marker in s:
              s = s.replace(marker, replacement_marker, 1)

          # Ensure upcoming submit uses only name + phone and the upcoming RPC reservation.
          start = s.find('async function submitReservation(){')
          end = s.find('\n}\n', start)
          if start == -1 or end == -1:
              raise SystemExit('No se encontró submitReservation')
          end += 2
          old_fn = s[start:end]
          new_fn = '''async function submitReservation(){
 if(!selectedProduct)return;
 if(SERVICE_CITY!=="Bonao")return alert("MEDIOUSAO está configurada exclusivamente para Bonao.");
 const name=document.getElementById("rName").value.trim(),phone=document.getElementById("rPhone").value.trim();
 if(!name||!phone)return alert("Completa nombre y teléfono.");
 if(reserveMode==="upcoming"){
   const {data,error}=await client.rpc("reserve_product",{p_product_id:selectedProduct.id,p_customer_name:name,p_customer_phone:phone,p_fulfillment_method:"pickup",p_delivery_address:null,p_delivery_sector:null,p_delivery_date:null,p_delivery_time:null,p_city:SERVICE_CITY});
   if(error){alert("No se pudo guardar la reserva. Inténtalo de nuevo.");console.error(error);return;}
   const row=data&&data[0];
   if(row&&row.order_number) localStorage.setItem("mediousao_last_reservation",JSON.stringify({order_id:row.order_id,order_number:row.order_number,phone}));
   alert("💚 ¡Reserva realizada! Te notificaremos cuando tu producto esté disponible.");
   show("home");
   loadUpcoming();
   return;
 }
 const address=reserveMode==="delivery"?document.getElementById("rAddress").value.trim():null;
 const sector=reserveMode==="delivery"?document.getElementById("rSector").value.trim():null;
 if(reserveMode==="delivery"&&!address)return alert("Completa la dirección de delivery.");
 if(reserveMode==="delivery"&&!sector)return alert("Completa el sector de Bonao.");
 const deliveryDate=reserveMode==="delivery"?document.getElementById("rDate").value:null,deliveryTime=reserveMode==="delivery"?document.getElementById("rTime").value:null;
 const {data,error}=await client.rpc("reserve_product",{p_product_id:selectedProduct.id,p_customer_name:name,p_customer_phone:phone,p_fulfillment_method:reserveMode,p_delivery_address:address,p_delivery_sector:sector,p_delivery_date:deliveryDate,p_delivery_time:deliveryTime,p_city:SERVICE_CITY});
 if(error){alert("No se pudo guardar la reserva.");console.error(error);return}
 const row=data&&data[0];
 if(row&&row.order_number) localStorage.setItem("mediousao_last_reservation",JSON.stringify({order_id:row.order_id,order_number:row.order_number,phone}));
 alert("💚 ¡Reserva realizada!");
 show("home");
 loadUpcoming();
}'''
          s = s[:start] + new_fn + s[end:]

          path.write_text(s, encoding='utf-8')
          PY

      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Set Próximamente to Reservar ahora only'
          git push
