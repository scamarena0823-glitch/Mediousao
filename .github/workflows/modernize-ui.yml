name: Modernize MEDIOUSAO UI

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/modernize-ui.yml'
      - 'README.md'

permissions:
  contents: write

jobs:
  modernize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply minimalist premium UI
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          css = r'''<style>
          *{box-sizing:border-box}
          html{scroll-behavior:smooth}
          body{margin:0;background:#f3f3f4;color:#111;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased}
          button,input,select{font:inherit}
          button{cursor:pointer;-webkit-tap-highlight-color:transparent}
          .app{max-width:480px;margin:auto;min-height:100vh;background:#fff;box-shadow:0 0 35px rgba(0,0,0,.08)}
          header{padding:18px 18px 14px;background:rgba(255,255,255,.97);position:sticky;top:0;z-index:5;border-bottom:1px solid #ececef;backdrop-filter:blur(12px)}
          .logo{font-size:29px;font-weight:950;letter-spacing:-1.4px;line-height:1}
          .logo .medio{color:#111}.logo .usao{color:#e50914}
          .sub{color:#777;margin-top:6px;font-size:13px}
          .brandline{height:3px;width:70px;background:#e50914;margin-top:9px;border-radius:10px}
          .search,input{width:100%;padding:13px 14px;border-radius:13px;border:1px solid #dedfe3;background:#f7f7f8;color:#111;font-size:16px;outline:none;transition:.18s}
          .search{margin-top:14px}
          .search:focus,input:focus{border-color:#111;box-shadow:0 0 0 3px rgba(0,0,0,.06);background:#fff}
          .grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}
          .card{overflow:hidden;background:#fff;border:1px solid #e5e5e8;border-radius:18px;box-shadow:0 6px 20px rgba(0,0,0,.055);transition:transform .16s,box-shadow .16s}
          .card:active{transform:scale(.985)}
          .photo{height:158px;background:#f5f5f6;display:flex;align-items:center;justify-content:center;font-size:55px;overflow:hidden}
          .photo img,.detailphoto img{width:100%;height:100%;object-fit:cover}
          .info{padding:13px}
          .name{font-weight:800;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
          .tag{color:#777;font-size:12px;margin-top:6px}
          .price{font-weight:900;font-size:19px;margin:9px 0}
          .btn{border:0;border-radius:13px;padding:12px 15px;background:#ededf0;color:#111;font-weight:800;font-size:15px;transition:transform .12s,filter .12s,box-shadow .12s}
          .btn:active{transform:scale(.97);filter:brightness(.96)}
          .btn.primary{background:#e50914;color:#fff;box-shadow:0 6px 14px rgba(229,9,20,.16)}
          .btn.dark{background:#111;color:#fff}
          .btn.full{width:100%}
          .filters{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}
          .filters select{width:100%;padding:11px;border-radius:12px;border:1px solid #ddd;background:#fff;font-size:14px;outline:none}
          .choices{display:grid;grid-template-columns:1fr 1fr;gap:9px}
          .choice{border:1px solid #ddd;border-radius:13px;padding:12px;background:#fff;text-align:left;font-weight:800;transition:.15s}
          .choice.on{border-color:#e50914;box-shadow:0 0 0 2px rgba(229,9,20,.08)}
          .row{display:flex;justify-content:space-between;align-items:center;gap:10px}
          .screen{display:none}.active{display:block}
          .section{display:flex;justify-content:space-between;align-items:center;margin:20px 0 11px}
          .section h2{font-size:20px;letter-spacing:-.3px;margin:0}
          main{padding:14px 18px 92px}
          .hero,.box,.notice{background:#fff;border:1px solid #e5e5e8;border-radius:18px;box-shadow:0 6px 20px rgba(0,0,0,.045)}
          .hero{padding:21px;margin-bottom:18px}
          .hero h1{font-size:29px;line-height:1.05;letter-spacing:-.9px;margin:0 0 9px}
          .hero .btn{margin-top:13px}
          .muted{color:#777;font-size:14px;line-height:1.45}
          nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(480px,100%);display:flex;justify-content:space-around;background:rgba(255,255,255,.97);border-top:1px solid #e2e2e5;padding:9px 8px calc(9px + env(safe-area-inset-bottom));z-index:8;backdrop-filter:blur(14px)}
          nav button{background:none;border:0;color:#777;font-weight:750;font-size:12px;padding:4px 7px;min-width:54px}
          nav .on{color:#e50914}
          .notice{padding:13px;color:#555;margin:10px 0;font-size:14px}
          .error{padding:14px;border-radius:13px;background:#fff0f0;color:#b0000a;margin:12px 0;border:1px solid #ffd0d0}
          .detailphoto{height:300px;border-radius:18px;background:#f5f5f6;display:flex;align-items:center;justify-content:center;font-size:100px;overflow:hidden}
          .qty{display:flex;align-items:center;gap:10px}
          .qty button{width:36px;height:36px;border-radius:10px;border:1px solid #ddd;background:#f4f4f5;color:#111;font-weight:900}
          .admin-item{padding:13px 0;border-bottom:1px solid #e5e5e7}
          .status-pill{display:inline-block;padding:5px 9px;border-radius:999px;font-size:12px;font-weight:800;background:#f1f1f3}
          .status-pill.red{background:#ffe8e8;color:#b0000a}
          .status-pill.green{background:#e8f8eb;color:#187a2b}
          .admin-item:last-child{border-bottom:0}
          @media(max-width:380px){.grid{gap:9px}.photo{height:145px}.info{padding:11px}.btn{padding:11px 12px;font-size:14px}}
          </style>'''

          s2 = re.sub(r'<style>.*?</style>', css, s, count=1, flags=re.S)
          s2 = re.sub(r'<button[^>]*onclick="show\(\'adminLogin\'\)"[^>]*>.*?</button>', '', s2, count=1, flags=re.S)
          s2 = s2.replace('<section><div class="section"><h2>⏳ Próximamente</h2></div><div id="upcomingGrid" class="grid"></div></section>', '<section><div class="section"><div><h2>⏳ Próximamente</h2><div class="muted" style="margin-top:4px">Te notificaremos cuando esté disponible.</div></div></div><div id="upcomingGrid" class="grid"></div></section>')
          s2 = s2.replace('alert("¡Reserva confirmada! El producto queda apartado por 24 horas. 🔥");show("home");loadProducts();', 'alert("💚 ¡Reserva realizada! Te notificaremos cuando esté disponible.");show("home");loadProducts();loadUpcoming();')
          if s2 != s:
              p.write_text(s2, encoding='utf-8')
          PY

      - name: Commit UI changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No UI changes needed"
          else
            git commit -m "Modernize MEDIOUSAO customer UI"
            git push
          fi
