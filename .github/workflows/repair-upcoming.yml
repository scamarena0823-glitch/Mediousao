name: Repair Próximamente y reservas
on:
  push:
    branches: [main]
    paths-ignore:
      - index.html
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch reservation UI safely
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          # Inicio: Upcoming debe anunciar reserva ilimitada.
          s=s.replace('Reserva por 24 h</span>', 'Reserva sin límite de tiempo</span>')
          s=s.replace('Reserva por 24 horas</h2>', 'Reserva</h2>')
          s=s.replace('La reserva dura 24 horas.</div>', 'La reserva se mantiene sin límite de tiempo.</div>')

          # ADM: usar el RPC seguro para cambiar el estado del producto.
          old='''async function toggleUpcomingAdmin(id,val){
  const {error}=await client.from("products").update({is_upcoming:val}).eq("id",id);
  if(error){alert("No se pudo actualizar: "+error.message);return;}
  await loadUpcomingAdmin();
  if(typeof loadUpcoming==='function') await loadUpcoming();
  if(typeof loadAdminProducts==='function') await loadAdminProducts();
}'''
          new='''async function toggleUpcomingAdmin(id,val){
  const state=val?'upcoming':'available';
  const {error}=await client.rpc("admin_set_product_state",{p_product_id:id,p_state:state});
  if(error){alert("No se pudo actualizar: "+error.message);return;}
  await loadUpcomingAdmin();
  if(typeof loadUpcoming==='function') await loadUpcoming();
  if(typeof loadAdminProducts==='function') await loadAdminProducts();
}'''
          s=s.replace(old,new)

          # Al marcar desde la lista principal, también usar el RPC seguro.
          if 'MEDIOUSAO_UPCOMING_RPC_V3' not in s:
              block=r'''<script id="MEDIOUSAO_UPCOMING_RPC_V3">
(function(){
  window.setUpcomingState=async function(id,state){
    const {error}=await client.rpc('admin_set_product_state',{p_product_id:id,p_state:state});
    if(error){alert('No se pudo actualizar el producto: '+error.message);return;}
    const msg=document.getElementById('adminMsg');
    if(msg){msg.className='notice';msg.textContent=state==='upcoming'?'Producto marcado como Próximamente. ⏳':state==='available'?'Producto disponible. 🟢':'Producto vendido / no disponible. 🔴';}
    if(typeof loadAdminProducts==='function') await loadAdminProducts();
    if(typeof loadUpcomingAdmin==='function') await loadUpcomingAdmin();
    if(typeof loadUpcoming==='function') await loadUpcoming();
  };
})();
</script>
'''
              s=s.replace('</body>',block+'</body>')

          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Fix upcoming product publishing flow"
          git push
