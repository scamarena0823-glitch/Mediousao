name: Repair Próximamente y reservas
on:
  push:
    branches: [main]
    paths-ignore:
      - index.html
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch reservation UI safely
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          s=s.replace('Reserva por 24 h</span>', 'Reserva sin límite de tiempo</span>')
          s=s.replace('Marca aquí los productos que todavía no están disponibles. Aparecerán en Inicio como “⏳ Próximamente” y podrán reservarse por 24 horas.', 'Marca aquí los productos que todavía no están disponibles. Aparecerán en Inicio como “⏳ Próximamente” y podrán reservarse sin límite de tiempo.')
          s=s.replace('Marca aquí los productos que todavía no están disponibles. Aparecerán en Inicio como “⏳ Próximamente” y podrán reservarse por 24 horas.', 'Marca aquí los productos que todavía no están disponibles. Aparecerán en Inicio como “⏳ Próximamente” y podrán reservarse sin límite de tiempo.')
          s=s.replace('Reserva por 24 horas</h2>', 'Reserva</h2>')
          s=s.replace('La reserva dura 24 horas.</div>', 'La reserva se mantiene sin límite de tiempo.</div>')

          if 'MEDIOUSAO_RESERVATION_UI_V2' not in s:
              block=r'''\n<script id="MEDIOUSAO_RESERVATION_UI_V2">\n(function(){\n  function updateReservationText(){\n    const box=document.getElementById('reserveProduct');\n    if(!box) return;\n    const text=(box.textContent||'').toLowerCase();\n    const upcoming=text.includes('próximamente') || text.includes('proximamente') || text.includes('upcoming');\n    const h=document.querySelector('#reserve h2');\n    if(h) h.textContent=upcoming?'Reservar — Próximamente':'Reservar por 24 horas';\n    const notices=document.querySelectorAll('#reserve .notice');\n    if(notices.length){\n      const n=notices[0];\n      n.textContent=upcoming?'🔒 Al confirmar, el producto queda apartado sin límite de tiempo y deja de aparecer disponible para otros clientes.':'🔒 Al confirmar, el producto queda apartado durante 24 horas y deja de aparecer disponible para otros clientes.';\n    }\n    const pf=document.querySelector('#pickupFields .notice');\n    if(pf) pf.textContent=upcoming?'🏪 Pasarás a recoger el producto. La reserva se mantiene sin límite de tiempo.':'🏪 Pasarás a recoger el producto. La reserva dura 24 horas.';\n  }\n  const start=()=>{\n    updateReservationText();\n    const box=document.getElementById('reserveProduct');\n    if(box) new MutationObserver(updateReservationText).observe(box,{childList:true,subtree:true,characterData:true});\n  };\n  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',start); else start();\n  window.cancelReservationFromApp=async function(){\n    const phone=(document.getElementById('rPhone')?.value||'').trim();\n    const order=prompt('Escribe el número de reserva, por ejemplo MED-123456');\n    if(!order) return;\n    if(!phone){ alert('Escribe primero el teléfono usado en la reserva.'); return; }\n    const {error}=await client.rpc('cancel_reservation',{p_order_number:order.trim(),p_customer_phone:phone});\n    if(error){ alert('No se pudo cancelar la reserva: '+error.message); return; }\n    alert('Reserva cancelada correctamente. El producto vuelve a estar disponible para otra reserva.');\n    if(typeof render==='function') render();\n    if(typeof show==='function') show('home');\n  };\n})();\n</script>\n'''
              anchor='</body>'
              s=s.replace(anchor, '<div id="reservationCancelSlot" style="margin-top:10px"><button class="btn full" onclick="cancelReservationFromApp()">❌ Cancelar reserva</button></div>\n'+anchor)
              s=s.replace(anchor, block+anchor)

          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Improve upcoming reservation UI"
          git push
