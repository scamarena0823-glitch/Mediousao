name: Repair Próximamente y reservas
on:
  push:
    branches: [main]
    paths-ignore:
      - index.html
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ajustar texto de reservas Próximamente
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('<span class="muted">Reserva sin límite de tiempo</span>', '')
          s = s.replace('<span class="muted">Reserva por 24 h</span>', '')
          s = s.replace('<h2>Reservar por 24 horas</h2>', '<h2>Reservar</h2>')
          s = s.replace('<div class="notice">🔒 Al confirmar, el producto queda apartado durante 24 horas y deja de aparecer disponible para otros clientes.</div>', '')
          s = s.replace('<div class="notice">🔒 Al confirmar, el producto queda apartado sin límite de tiempo y deja de aparecer disponible para otros clientes.</div>', '')
          s = s.replace('<div class="notice">🏪 Pasarás a recoger el producto. La reserva se mantiene sin límite de tiempo.</div>', '<div class="notice">🏪 Pasarás a recoger el producto.</div>')
          s = s.replace('⏳ Próximamente · Reserva por 24 horas ·', '⏳ Próximamente ·')
          s = s.replace('⏳ Próximamente · Reserva por 24 h ·', '⏳ Próximamente ·')
          s = s.replace('⏳ Próximamente · Reserva sin límite de tiempo ·', '⏳ Próximamente ·')
          p.write_text(s, encoding='utf-8')
          print('Texto de Próximamente ajustado: solo Reservar')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Simplify upcoming reservation text"
          git push
