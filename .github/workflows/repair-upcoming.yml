name: Repair Próximamente
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='<!-- MEDIOUSAO_UPCOMING_PER_PRODUCT -->'
          if marker in s:
              s=s[:s.index(marker)]
          block='''<!-- MEDIOUSAO_UPCOMING_PER_PRODUCT -->
          <script>
          async function setUpcomingState(id,state){
            const {error}=await client.rpc('admin_set_product_state',{p_product_id:id,p_state:state});
            if(error){alert('No se pudo actualizar el producto: '+error.message);return;}
            const msg=document.getElementById('adminMsg');
            if(msg){msg.className='notice';msg.textContent=state==='upcoming'?'Producto marcado como Próximamente. ⏳':state==='available'?'Producto disponible. 🟢':'Producto vendido / no disponible. 🔴';}
            await loadAdminProducts();
            if(typeof loadUpcoming==='function')await loadUpcoming();
            if(typeof loadUpcomingAdmin==='function')await loadUpcomingAdmin();
          }
          async function removeUpcoming(id){
            const wrap=document.getElementById('upcoming-actions-'+id);
            if(wrap)wrap.innerHTML='<button class="btn" onclick="setUpcomingState(\\''+id+'\\',\\'available\\')">🟢 Poner disponible</button><button class="btn danger" onclick="setUpcomingState(\\''+id+'\\',\\'sold\\')">🔴 Vendido / no disponible</button>';
          }
          async function loadAdminProducts(){
            const el=document.getElementById('adminProducts'); if(!el)return;
            const {data,error}=await client.from('products').select('*').eq('city',SERVICE_CITY).order('created_at',{ascending:false});
            if(error){el.innerHTML='<div class="notice">Error: '+esc(error.message)+'</div>';return;}
            if(!data||!data.length){el.innerHTML='<div class="notice">No hay productos.</div>';return;}
            el.innerHTML=data.map(p=>{
              const upcoming=!!p.is_upcoming;
              const available=!!p.available;
              let actions='';
              if(upcoming){
                actions='<div id="upcoming-actions-'+p.id+'" class="row" style="gap:8px;margin-top:8px"><button class="btn" onclick="removeUpcoming(\\''+p.id+'\\')">🔄 Quitar Próximamente</button></div>';
              }else if(available){
                actions='<div class="row" style="gap:8px;margin-top:8px"><button class="btn" onclick="setUpcomingState(\\''+p.id+'\\',\\'upcoming\\')">⏳ Marcar Próximamente</button><button class="btn danger" onclick="setUpcomingState(\\''+p.id+'\\',\\'sold\\')">🔴 Vendido / no disponible</button></div>';
              }else{
                actions='<div class="row" style="gap:8px;margin-top:8px"><button class="btn" onclick="setUpcomingState(\\''+p.id+'\\',\\'available\\')">🟢 Poner disponible</button><button class="btn" onclick="setUpcomingState(\\''+p.id+'\\',\\'upcoming\\')">⏳ Marcar Próximamente</button></div>';
              }
              return '<div class="box" style="padding:12px;margin:8px 0"><div class="row"><strong>'+esc(p.name||'Sin nombre')+'</strong><span class="muted">'+money(p.price||0)+'</span></div><div class="muted">'+(upcoming?'⏳ Próximamente':available?'🟢 Disponible':'🔴 No disponible')+'</div>'+actions+'</div>';
            }).join('');
          }
          async function loadUpcomingAdmin(){
            const el=document.getElementById('adminUpcomingProducts'); if(!el)return;
            const {data,error}=await client.from('products').select('*').eq('city',SERVICE_CITY).eq('is_upcoming',true).order('created_at',{ascending:false});
            if(error){el.innerHTML='<div class="notice">Error: '+esc(error.message)+'</div>';return;}
            if(!data||!data.length){el.innerHTML='<div class="muted">No hay productos Próximamente.</div>';return;}
            el.innerHTML=data.map(p=>'<div class="box" style="padding:12px;margin:8px 0"><div class="row"><strong>'+esc(p.name||'Sin nombre')+'</strong><span>⏳</span></div><div id="upcoming-actions-'+p.id+'" class="row" style="gap:8px;margin-top:8px"><button class="btn" onclick="removeUpcoming(\\''+p.id+'\\')">🔄 Quitar Próximamente</button></div></div>').join('');
          }
          </script>
          </body>
          </html>'''
          p.write_text(s+block,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Fix explicit upcoming product actions"
          git push
