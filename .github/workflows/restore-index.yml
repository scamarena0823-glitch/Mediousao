name: Restore MEDIOUSAO index
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/restore-index.yml'

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore index from last good app commit
        run: |
          git checkout 44768ef3a7d2a57551d2816f31f82600f246fd58 -- index.html
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('<script src="ready-flow.js"></script>','<script src="ready-flow.js?v=20260913-1"></script>')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit restored app
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Restore MEDIOUSAO app and refresh ready flow [skip ready flow]"
          git push